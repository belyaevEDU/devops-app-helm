deploymentMode: Monolithic

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  schemaConfig:
    configs:
      - from: "2026-07-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  storage:
    type: filesystem
  patternIngester:
    enabled: true

minio:
  enabled: false

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    size: 20Gi
    storageClass: "local-path" # rancher's local-path-provisioner

write:
  replicas: 0
read:
  replicas: 0
backend:
  replicas: 0