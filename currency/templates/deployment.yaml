apiVersion: apps/v1
kind: Deployment
metadata:
  name: currency-deployment
  namespace: {{ .Values.namespace }}
  labels:
    {{ .Values.label.key }}: {{ .Values.label.value }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  selector:
    matchLabels:
      {{ .Values.label.key }}: {{ .Values.label.value }}
  template:
    metadata:
      labels:
        {{ .Values.label.key }}: {{ .Values.label.value }}
    spec:
      initContainers:
        - name: fix-log-perms
          image: busybox:latest
          command: ["sh", "-c", "chown -R 1000:1000 /app/server/logs"]
          volumeMounts:
          - mountPath: /app/server/logs
            name: currency-logs
          securityContext:
            runAsUser: 0
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      containers: # converted from docker-compose.yml via kompose
        - image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          name: restapi-currency
          ports:
            - containerPort: {{ .Values.container.port }}
              protocol: TCP
          securityContext:
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 1000
            runAsUser: 1000
          volumeMounts:
            - mountPath: /app/server/logs
              name: currency-logs
            - mountPath: /app/requester/cache
              name: restapi-currency-tmpfs0
            - mountPath: /tmp
              name: restapi-currency-tmpfs1
      restartPolicy: Always
      volumes:
        - name: currency-logs
          hostPath:
            path: /var/log/currency
            type: DirectoryOrCreate
        - emptyDir:
            medium: Memory
          name: restapi-currency-tmpfs0
        - emptyDir:
            medium: Memory
          name: restapi-currency-tmpfs1
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
              - key: {{ .Values.label.key }}
                operator: In
                values:
                - {{ .Values.label.value }}
            topologyKey: "kubernetes.io/hostname"