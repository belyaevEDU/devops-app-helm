{{- if .Values.observability.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: currency-svc-monitor
  namespace: {{ .Values.namespace }}
  labels:
    {{ .Values.label.key }}: {{ .Values.label.value }}
spec:
  selector:
    matchLabels:
      {{ .Values.label.key }}: {{ .Values.label.value }}
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
{{- end }}
